<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Link Tags Example</title>
</head>
<body>
    <header>
        <h1>HTML Link Examples</h1>
    </header>

    <section>
        <h2>External Link</h2>
        <p>Click the link below to visit a website:</p>
        <p><a href="https://www.example.com" target="_blank">Visit Example Website</a></p>
    </section>

    <section>
        <h2>Internal Link</h2>
        <p>Navigate to another page within the same website:</p>
        <p><a href="about.html">Go to About Page</a></p>
    </section>

    <section>
        <h2>Email Link</h2>
        <p>Send an email using a link:</p>
        <p><a href="mailto:example@email.com">Send Email</a></p>
    </section>

    <section>
        <h2>Download Link
