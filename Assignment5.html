<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Example</title>
</head>
<body>
    <header>
        <h1>Adding Images to a Webpage</h1>
    </header>

    <section>
        <h2>Local Image</h2>
        <p>This image is loaded from the local directory:</p>
        <img src="images/sample.jpg" alt="Sample Image" width="500">
    </section>

    <section>
        <h2>Online Image</h2>
        <p>This image is loaded from an external source:</p>
        <img src="https://example.com/sample-image.jpg" alt="External Image" width="500">
    </section>

    <section>
        <h2>Clickable Image</h2>
        <p>Click the image below to visit a website:</p>
        <a href="https://www.example.com">
            <img src="images/logo.png" alt="Example Logo" width="200">
        </a>
    </section>

    <footer>
        <p>&copy; 2025 Image Webpage</p>
    </footer>
</body>
</html>
